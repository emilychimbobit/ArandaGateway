trigger:
  branches:
    include:
      - main
      - develop
      - qa
  paths:
    include:
      - src/backend/api/**
      - tests/ArandaGateway.Api.Tests/**
      - ArandaGateway.slnx
      - azure-pipeline.yml

pr: none

pool:
  vmImage: ubuntu-latest

variables:
- ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/develop') }}:
  - group: vg-iac-dev
- ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/qa') }}:
  - group: vg-iac-qa
- ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/main') }}:
  - group: vg-iac-prd
- name: dotnetVersion
  value: '10.0.x'
- name: solution
  value: 'ArandaGateway.slnx'
- name: apiProject
  value: 'src/backend/api/ArandaGateway.Api/ArandaGateway.Api.csproj'
- ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/develop') }}:
  - name: webAppName
    value: 'ase-gestionaranda-dev'
  - name: deploymentEnvironment
    value: 'DEV'
- ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/qa') }}:
  - name: webAppName
    value: 'ase-gestionaranda-qa'
  - name: deploymentEnvironment
    value: 'QA'
- ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/main') }}:
  - name: webAppName
    value: 'ase-gestionaranda-prd'
  - name: deploymentEnvironment
    value: 'PRD'
- name: resourceGroup
  value: 'rg-agenteminsur'
- name: publishDirectory
  value: '$(Build.ArtifactStagingDirectory)/publish'
- name: packagePath
  value: '$(Build.ArtifactStagingDirectory)/aranda-gateway-api.zip'

steps:
  - checkout: self
    clean: true

  - task: UseDotNet@2
    displayName: 'Instalar .NET SDK'
    inputs:
      packageType: sdk
      version: '$(dotnetVersion)'

  - script: dotnet restore '$(solution)'
    displayName: 'Restaurar solución'

  - script: dotnet build '$(solution)' --no-restore --configuration Release
    displayName: 'Compilar solución'

  - script: dotnet test '$(solution)' --no-build --configuration Release --logger "trx;LogFileName=$(Agent.TempDirectory)/aranda-gateway-tests.trx"
    displayName: 'Ejecutar pruebas'

  - script: >-
      dotnet publish '$(apiProject)'
      --no-build
      --configuration Release
      --output '$(publishDirectory)'
    displayName: 'Publicar API'

  - task: ArchiveFiles@2
    displayName: 'Empaquetar API'
    inputs:
      rootFolderOrFile: '$(publishDirectory)'
      includeRootFolder: false
      archiveType: zip
      archiveFile: '$(packagePath)'
      replaceExistingArchive: true

  - task: Bash@3
    displayName: 'Desplegar API en Azure App Service'
    inputs:
      targetType: inline
      script: |
        set -euo pipefail

        echo "=============================================="
        echo "Ambiente de despliegue: $(deploymentEnvironment)"
        echo "App Service: $AZURE_WEBAPP_NAME"
        echo "Grupo de recursos: $AZURE_RESOURCE_GROUP"
        echo "=============================================="

        az login \
          --service-principal \
          --username "$ARM_CLIENT_ID" \
          --password "$ARM_CLIENT_SECRET" \
          --tenant "$ARM_TENANT_ID" \
          --output none

        az account set --subscription "$ARM_SUBSCRIPTION_ID"

        : "${ARANDA_BASE_URL:?Falta la variable ARANDA_BASE_URL en el grupo de variables}"
        : "${ARANDA_API_KEY:?Falta la variable secreta ARANDA_API_KEY en el grupo de variables}"
        : "${GATEWAY_API_KEY:?Falta la variable secreta GATEWAY_API_KEY en el grupo de variables}"

        echo "Configurando App Service como Linux Code (.NET 10)..."
        az webapp config set \
          --resource-group "$AZURE_RESOURCE_GROUP" \
          --name "$AZURE_WEBAPP_NAME" \
          --linux-fx-version "DOTNETCORE|10.0" \
          --startup-file "dotnet ArandaGateway.Api.dll" \
          --output none

        echo "Configurando secretos y URL de la API..."
        az webapp config appsettings set \
          --resource-group "$AZURE_RESOURCE_GROUP" \
          --name "$AZURE_WEBAPP_NAME" \
          --settings \
            "Aranda__BaseUrl=$ARANDA_BASE_URL" \
            "Aranda__ApiKey=$ARANDA_API_KEY" \
            "Gateway__ApiKey=$GATEWAY_API_KEY" \
          --output none

        az webapp deploy \
          --resource-group "$AZURE_RESOURCE_GROUP" \
          --name "$AZURE_WEBAPP_NAME" \
          --src-path "$PACKAGE_PATH" \
          --type zip \
          --async false
    env:
      ARM_CLIENT_ID: $(ARM_CLIENT_ID)
      ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
      ARM_TENANT_ID: $(ARM_TENANT_ID)
      ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
      ARANDA_BASE_URL: $(ARANDA_BASE_URL)
      ARANDA_API_KEY: $(ARANDA_API_KEY)
      GATEWAY_API_KEY: $(GATEWAY_API_KEY)
      AZURE_RESOURCE_GROUP: $(resourceGroup)
      AZURE_WEBAPP_NAME: $(webAppName)
      PACKAGE_PATH: $(packagePath)

  - task: PublishTestResults@2
    displayName: 'Publicar resultados de pruebas'
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: VSTest
      testResultsFiles: '$(Agent.TempDirectory)/aranda-gateway-tests.trx'
      failTaskOnFailedTests: true